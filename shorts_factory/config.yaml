# ==========================================================
#  Shorts Factory — настройки. Меняйте значения после двоеточия.
# ==========================================================

# --- Где искать залетевшие нарезки ---------------------------------
# Каналы-доноры: скрипт берёт их Shorts с наибольшим числом просмотров
# и повторяет тот же момент из фильма. Можно добавлять свои (@handle).
donor_channels:
  - "@darked1trus"
  - "@samyykadr"
  - "@kinocomrad"
  - "@greatscene2022"
  - "@ci-cutimpact"
  - "@mayorkraft"
  - "@wolfigen_film"
  - "@moviemix-dvx"
  - "@madcut_movieclips"

# Сколько последних Shorts смотреть на каждом канале
# (свежие ещё не набрали просмотров, поэтому смотрим глубже)
scan_per_channel: 150
# Брать только ролики, у которых минимум столько просмотров
min_views: 300000

# --- Сколько и каких роликов делать --------------------------------
count: 5            # роликов за один запуск
min_duration: 30    # секунд
max_duration: 60    # секунд (длиннее — обрезается)

# --- Поиск исходника сцены -----------------------------------------
# Сколько горизонтальных видео проверять в поисках той же сцены
max_source_candidates: 6
# Видео без автосубтитров расшифровываются Whisper'ом, если короче (мин)
max_whisper_source_minutes: 40
# Насколько точно текст должен совпасть с нарезкой-донором (0–100)
match_threshold: 68

# --- Распознавание речи (Whisper) ----------------------------------
whisper_model: "large-v3"      # на NVIDIA; лучшее качество
whisper_model_cpu: "medium"    # если видеокарта не заработала
language: "ru"

# --- Внешний вид ---------------------------------------------------
# Какую часть высоты экрана занимает чёткое видео (остальное — размытый фон).
# 0.62 = как на примере (видео крупно, края кадра обрезаются).
# 0.32 = весь кадр целиком, без обрезки.
video_height_ratio: 0.62
blur_strength: 25
background_darken: 0.10        # 0 = без затемнения фона

subtitles:
  font: "Impact"               # шрифт должен быть установлен в Windows
  size: 92
  color: "#FFE94D"             # жёлтый, как на примере
  outline_color: "#000000"
  outline: 6
  max_words: 3                 # слов на экране одновременно
  max_chars: 18
  position_y: 0.52             # 0 = верх экрана, 1 = низ
  uppercase: true
  pop_animation: true          # «выпрыгивание» каждой фразы

# Подпись канала мелким полупрозрачным текстом (пусто = не добавлять)
watermark: ""

# Громкость по стандарту YouTube (-14 LUFS)
normalize_audio: true

# --- Доступ к YouTube ----------------------------------------------
# Если YouTube пишет «подтвердите, что вы не бот» — укажите браузер,
# где вы залогинены в YouTube (firefox работает лучше всего),
# или путь к файлу cookies.txt.
cookies_from_browser: ""       # например: "firefox"
cookies_file: ""               # например: "cookies.txt"

# --- Папки ---------------------------------------------------------
output_dir: "output"
work_dir: "work"
keep_work_files: false
